services:
  db:
    image: postgres:16-alpine
    container_name: elf-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: elf_studio
      POSTGRES_USER: elf
      POSTGRES_PASSWORD: elf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - elf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elf -d elf_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elf_pgdata:
